name: Prepare development sources

on:
  workflow_dispatch:
  push:
    branches: ["feat/windows-native-restore"]
    paths: [".github/workflows/prepare-sources.yml"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-sources
          path: |
            src/
            tests/*.rs
            Cargo.lock
          retention-days: 7
