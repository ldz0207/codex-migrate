name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-restore:
    name: Native restore protocol (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated native-restoration tests
        run: |
          python -VV
          python -m unittest discover -s tests -p test_native_restore.py -v

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --features gui -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --features gui
      - name: Keep Windows CLI for isolated smoke checks
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-cli
          path: target/debug/codex-migrate.exe
          retention-days: 7

